name: cloudreve
description: Native Flutter Android client for Cloudreve v4 with file management and media playback.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.2.0
  cloudreve_api_client:
    path: api/
  cookie_jar: ^4.0.8
  crypto: 3.0.7
  # Keep the font for media_kit controls; release builds tree-shake unused glyphs.
  cupertino_icons: ^1.0.6
  dio: ^5.4.3
  dio_cookie_manager: ^3.1.1
  enough_convert: ^1.6.0
  file_picker: ^10.3.10
  flutter_local_notifications: ^17.0.0
  flutter_secure_storage: ^9.2.4
  fluttertoast: ^8.2.4
  go_router: ^14.1.4
  just_audio: ^0.10.6
  # Pinned native video stack: revalidate Android lifecycle workarounds on upgrade.
  media_kit: 1.2.6
  media_kit_libs_video: 1.0.7
  media_kit_video: 2.0.1
  open_file: ^3.3.2
  package_info_plus: ^9.0.1
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  photo_view: ^0.14.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_icons:
  android: true
  ios: true
  image_path: assets/logo.png
